name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-deploy.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/ -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        # 日付(UTC) + commitの短縮SHA。:latest だけだと Azure Container Apps が
        # イメージの「文字列」が変わったかどうかでしか新リビジョンを作るか判断しない
        # (タグの中身が変わっても文字列が同じなら気づかない)ため、
        # デプロイには一意なタグを別途使う。日付だけだと同じ日に複数回pushした場合に
        # 上書きされて同じ問題が再発するため、短縮SHAを組み合わせて一意性を保証する。
        run: echo "tag=$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-starter:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-starter:${{ steps.tag.outputs.tag }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name rag-starter-app \
              --resource-group rag-starter-rg \
              --image ${{ secrets.DOCKERHUB_USERNAME }}/rag-starter:${{ steps.tag.outputs.tag }}
